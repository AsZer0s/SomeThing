mode: rule
log-level: info

dns:
  enable: true
  enhanced-mode: fake-ip
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter:
    - '+.lan'
    - '*'
    - '+.local'
    - '+.cmpassport.com'
    - 'id6.me'
    - 'open.e.189.cn'
    - 'mdn.open.wo.cn'
    - 'opencloud.wostore.cn'
    - 'auth.wosms.cn'
    - '+.10099.com.cn'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'lancache.steamcontent.com'

proxy-providers:
  Subscribe:
    type: http
    url: http://your-service-provider
    interval: 86400
    path: ./proxies/Subscribe.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 600

proxy-groups:
  - name: Manual
    type: select
    icon: https://github.com/shindgewongxj/WHATSINStash/raw/main/icon/%24tash.png
    use:
      - Subscribe
    proxies:
      - HongKong
      - United States
      - Singapore
      - Japan
      - Germany
      - DIRECT

  - name: Global
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
    proxies:
      - Manual
      - HongKong
      - United States
      - Singapore
      - Japan
      - Germany

  - name: Streaming
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png
    proxies:
      - Manual
      - HongKong
      - United States
      - Singapore
      - Japan
      - Germany

  - name: Microsoft
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Microsoft.png
    proxies:
      - Manual
      - HongKong
      - United States
      - Singapore
      - Japan
      - Germany

  - name: Google
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google_Search.png
    proxies:
      - Manual
      - HongKong
      - United States
      - Singapore
      - Japan
      - Germany

  - name: AI
    type: select
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/OpenAI.png
    proxies:
      - Manual
      - HongKong
      - United States
      - Singapore
      - Japan
      - Germany

  - name: Social
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Twitter.png
    proxies:
      - Manual
      - HongKong
      - United States
      - Singapore
      - Japan
      - Germany

  - name: Telegram
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png
    proxies:
      - Manual
      - HongKong
      - United States
      - Singapore
      - Japan
      - Germany

  - name: Game
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Game.png
    proxies:
      - Manual
      - HongKong
      - United States
      - Singapore
      - Japan
      - Germany
      - DIRECT

  - name: Emby
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Emby.png
    include-all: true
    proxies:
      - HongKong
      - United States
      - Singapore
      - Japan
      - Germany

  - name: Spotify
    type: select
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Spotify.png
    proxies:
      - Manual
      - HongKong
      - United States
      - Singapore
      - Japan
      - Germany

  - name: Final
    type: select
    icon: https://github.com/shindgewongxj/WHATSINStash/raw/main/icon/friestash.png
    proxies:
      - Manual
      - HongKong
      - United States
      - Singapore
      - Japan
      - Germany
      - DIRECT

  - name: HongKong
    type: url-test
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Hong_Kong.png
    url: http://www.gstatic.com/generate_204
    interval: 600
    include-all: true
    filter: '(?i)🇭🇰|香港|沪港|深港|广港|(\b(HK|HKG|Hong\s?Kong|Hong)\b)'

  - name: United States
    type: url-test
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
    url: http://www.gstatic.com/generate_204
    interval: 600
    include-all: true
    filter: '(?i)🇺🇸|美国|洛杉矶|圣何塞|西雅图|硅谷|纽约|芝加哥|达拉斯|凤凰城|弗里蒙特|阿什本|(\b(US|USA|United\s?States|America|LA|LAX|SJC|SEA|NYC|ORD|DFW|PHX|IAD)\b)'

  - name: Singapore
    type: url-test
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Singapore.png
    url: http://www.gstatic.com/generate_204
    interval: 600
    include-all: true
    filter: '(?i)🇸🇬|新加坡|狮城|坡|(\b(SG|SGP|SIN|Singapore)\b)'

  - name: Japan
    type: url-test
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png
    url: http://www.gstatic.com/generate_204
    interval: 600
    include-all: true
    filter: '(?i)🇯🇵|日本|东京|大阪|埼玉|名古屋|(\b(JP|JPN|Japan|Tokyo|Osaka|TYO|NRT|HND|KIX)\b)'

  - name: Germany
    type: url-test
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Germany.png
    url: http://www.gstatic.com/generate_204
    interval: 600
    include-all: true
    filter: '(?i)🇩🇪|德国|法兰克福|柏林|慕尼黑|杜塞尔多夫|纽伦堡|(\b(DE|DEU|Germany|German|Frankfurt|Berlin|Munich|FRA|BER|MUC)\b)'

